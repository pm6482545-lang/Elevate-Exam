<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elevate Kenya Predictions - Examination Generator</title>
    <style>
        :root {
            --primary-color: #1e3a8a;
            --secondary-color: #3b82f6;
            --background-color: #f8fafc;
            --card-background: #ffffff;
            --text-color: #1e293b;
            --border-color: #cbd5e1;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--background-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 700px;
            background: var(--card-background);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: var(--primary-color);
            font-size: 24px;
            text-align: center;
            margin-bottom: 5px;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
        }

        select, input[type="text"], textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 14px;
            box-sizing: border-box;
            background-color: #fff;
        }

        textarea {
            resize: vertical;
            height: 90px;
        }

        select:focus, input:focus, textarea:focus {
            outline: none;
            border-color: var(--secondary-color);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        }

        button {
            width: 100%;
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #1d4ed8;
        }

        .result-box {
            margin-top: 25px;
            background-color: #0f172a;
            color: #38bdf8;
            padding: 15px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 13px;
            white-space: pre-wrap;
            max-height: 300px;
            overflow-y: auto;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Elevate Kenya Predictions</h1>
    <div class="subtitle">KICD Curriculum-Aligned Examination Generator</div>

    <form id="examForm">
        <div class="form-group">
            <label for="grade">Select Grade Level:</label>
            <select id="grade" required>
                <optgroup label="Primary School">
                    <option value="Grade 1">Grade 1</option>
                    <option value="Grade 2">Grade 2</option>
                    <option value="Grade 3">Grade 3</option>
                    <option value="Grade 4">Grade 4</option>
                    <option value="Grade 5">Grade 5</option>
                    <option value="Grade 6">Grade 6</option>
                </optgroup>
                <optgroup label="Junior Secondary School (JSS)">
                    <option value="Grade 7 (JSS)">Grade 7 (JSS)</option>
                    <option value="Grade 8 (JSS)">Grade 8 (JSS)</option>
                    <option value="Grade 9 (JSS)" selected>Grade 9 (JSS)</option>
                </optgroup>
            </select>
        </div>

        <div class="form-group">
            <label for="subject">Subject Name:</label>
            <input type="text" id="subject" placeholder="e.g., Mathematics, Integrated Science" required value="Mathematics">
        </div>

        <div class="form-group">
            <label for="term">Term:</label>
            <select id="term" required>
                <option value="Term 1">Term 1</option>
                <option value="Term 2" selected>Term 2 (Cumulative)</option>
                <option value="Term 3">Term 3 (End of Year)</option>
            </select>
        </div>

        <div class="form-group">
            <label for="total_marks">Total Marks:</label>
            <input type="text" id="total_marks" value="100" required>
        </div>

        <div class="form-group">
            <label for="custom_instructions">Custom Exam Structure & Settings:</label>
            <textarea id="custom_instructions" placeholder="Define exact guidelines, number of sections, specific strands to emphasize, question styles, or formatting parameters..."></textarea>
        </div>

        <button type="submit" id="submitBtn">Generate KNEC Blueprint & Paper</button>
    </form>

    <div id="resultBox" class="result-box"></div>
</div>

<script>
    document.getElementById('examForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const submitBtn = document.getElementById('submitBtn');
        const resultBox = document.getElementById('resultBox');
        
        submitBtn.disabled = true;
        submitBtn.textContent = 'Generating Precise Exam Paper...';
        resultBox.style.display = 'block';
        resultBox.textContent = 'Processing blueprint mapping and custom LaTeX formatting...';

        const payload = {
            grade: document.getElementById('grade').value,
            subject: document.getElementById('subject').value,
            term: document.getElementById('term').value,
            total_marks: parseInt(document.getElementById('total_marks').value) || 100,
            custom_instructions: document.getElementById('custom_instructions').value
        };

        try {
            const response = await fetch('/api/generate-exam', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(payload)
            });

            const data = await response.json();
            resultBox.textContent = JSON.stringify(data, null, 2);
        } catch (error) {
            resultBox.textContent = 'Error communicating with generation engine: ' + error.message;
        } finally {
            submitBtn.disabled = false;
            submitBtn.textContent = 'Generate KNEC Blueprint & Paper';
        }
    });
</script>

</body>
</html>
